<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RetailPOS | Portal</title>
    <style>
        body {
            margin: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #4f46e5;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: white;
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            color: #1e293b;
            width: 90%;
            max-width: 400px;
        }
        h1 { margin: 0; font-size: 2rem; color: #4f46e5; }
        p { color: #64748b; font-weight: 600; margin-bottom: 30px; }
        .btn {
            display: block;
            background: #4f46e5;
            color: white;
            text-decoration: none;
            padding: 15px;
            border-radius: 15px;
            font-weight: 800;
            transition: transform 0.2s;
        }
        .btn:active { transform: scale(0.95); }
        .setup-box {
            margin-top: 20px;
            font-size: 0.8rem;
            text-align: left;
            background: #f8fafc;
            padding: 15px;
            border-radius: 10px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>RetailPOS</h1>
    <p>Elite Cloud System</p>
    
    <div id="setup-ui">
        <div class="setup-box">
            <label><b>PASTE GITHACK URL ONCE:</b></label>
            <input type="text" id="url-input" placeholder="https://raw.githack.com/...">
        </div>
        <br>
        <button onclick="saveAndOpen()" class="btn" style="width:100%; border:none; cursor:pointer;">LAUNCH POS</button>
    </div>

    <div id="launch-ui" style="display:none;">
        <a href="#" id="pos-link" class="btn">OPEN POS SYSTEM</a>
        <br>
        <button onclick="resetUrl()" style="background:none; border:none; color:#94a3b8; cursor:pointer; font-size:0.7rem;">Change URL/Update Source</button>
    </div>
</div>

<script>
    const storageKey = "my_pos_url";

    function init() {
        const savedUrl = localStorage.getItem(storageKey);
        if (savedUrl) {
            document.getElementById('setup-ui').style.display = 'none';
            document.getElementById('launch-ui').style.display = 'block';
            document.getElementById('pos-link').href = savedUrl;
        }
    }

    function saveAndOpen() {
        const url = document.getElementById('url-input').value;
        if (url.includes('githack.com')) {
            localStorage.setItem(storageKey, url);
            window.location.reload();
        } else {
            alert("Please enter a valid Githack URL");
        }
    }

    function resetUrl() {
        localStorage.removeItem(storageKey);
        window.location.reload();
    }

    init();
</script>

</body>
</html>
