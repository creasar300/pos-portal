<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meeting Calendar Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --border: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --primary: #0f172a; 
            --primary-hover: #334155;
            --accent: #3b82f6;
            --danger: #ef4444;
            --success: #10b981;
            --highlight-bg: #fef08a; 
            --highlight-border: #eab308;
            --highlight-text: #854d0e;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            --radius-md: 0.5rem;
            --radius-lg: 1rem;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            padding: 20px;
            margin: 0;
            overflow-x: hidden;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        .header-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 15px; }
        .controls-group { display: flex; align-items: center; gap: 15px; }
        .calendar-controls, .search-controls { display: flex; align-items: center; gap: 15px; background: var(--surface); padding: 8px 16px; border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); border: 1px solid var(--border); }
        .search-controls input { border: none; outline: none; font-family: inherit; font-size: 0.9rem; width: 250px; background: transparent; }
        .view-title { font-size: 1.25rem; font-weight: 900; text-transform: uppercase; letter-spacing: -0.5px; min-width: 140px; text-align: center; }

        .btn { border-radius: var(--radius-md); font-weight: 600; cursor: pointer; padding: 8px 16px; font-size: 0.85rem; transition: all 0.2s; border: 1px solid transparent; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-outline { background: var(--surface); color: var(--text-main); border-color: var(--border); }
        .btn-outline:hover { background: var(--bg); }
        .btn-accent { background: var(--bg); color: var(--accent); border-color: var(--accent); }
        .btn-accent:hover { background: #eff6ff; }
        .btn-success { background: var(--bg); color: var(--success); border-color: var(--success); }
        .btn-success:hover { background: #ecfdf5; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover { opacity: 0.9; }
        .btn-danger-outline { background: var(--bg); color: var(--danger); border-color: var(--border); }
        .btn-danger-outline:hover { background: #fee2e2; border-color: var(--danger); }
        .btn-icon { background: transparent; border: 1px solid var(--border); border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-main); font-weight: bold; }
        .btn-icon:hover { background: var(--bg); }

        .calendar-wrapper { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--shadow-sm); }

        #yearly-view { display: block; }
        .yearly-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
        .month-card { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 15px; cursor: pointer; transition: all 0.2s; display: flex; flex-direction: column; min-height: 160px; min-width: 0; }
        .month-card:hover { border-color: var(--accent); box-shadow: var(--shadow-md); transform: translateY(-2px); }
        .month-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
        .month-card-title { font-size: 1.1rem; font-weight: 900; color: var(--text-main); text-transform: uppercase; }
        .month-card-count { font-size: 0.75rem; font-weight: 700; color: var(--accent); background: #eff6ff; padding: 2px 8px; border-radius: 99px; }
        .month-card-body { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
        .mini-meeting-pill { font-size: 0.7rem; font-weight: 600; background: var(--surface); border: 1px solid var(--border); padding: 4px 8px; border-radius: 4px; color: var(--text-main); transition: all 0.2s; cursor: pointer; display: block; width: 100%; box-sizing: border-box; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .mini-meeting-pill:hover { border-color: var(--accent); }
        .mini-meeting-pill.highlight-match { background: var(--highlight-bg); border-color: var(--highlight-border); color: var(--highlight-text); box-shadow: 0 0 0 2px rgba(234, 179, 8, 0.2); }

        #monthly-view { display: none; }
        .grid-header { display: grid; grid-template-columns: repeat(7, 1fr); gap: 12px; margin-bottom: 12px; text-align: right; font-weight: 700; font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; padding-right: 10px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 12px; }
        .day-cell { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-md); min-height: 120px; padding: 8px; display: flex; flex-direction: column; transition: all 0.2s; cursor: pointer; min-width: 0; }
        .day-cell:hover { border-color: var(--text-muted); box-shadow: var(--shadow-md); }
        .day-cell.other-month { opacity: 0.4; }
        .day-cell.today { background: #eff6ff; border-color: var(--accent); }
        .day-number { text-align: right; font-weight: 900; font-size: 1.1rem; margin-bottom: 8px; color: var(--text-main); }
        .meeting-pill { background: var(--surface); border-left: 4px solid var(--accent); padding: 6px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; margin-bottom: 6px; box-shadow: var(--shadow-sm); cursor: pointer; transition: transform 0.1s; display: block; width: 100%; box-sizing: border-box; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .meeting-pill:hover { transform: scale(1.02); }
        .meeting-pill.status-CANCELED { border-color: var(--danger); text-decoration: line-through; opacity: 0.7; }
        .meeting-pill.status-ATTENDED { border-color: #10b981; opacity: 0.8; }
        .more-badge { font-size: 0.7rem; font-weight: 700; color: var(--text-muted); text-align: center; margin-top: auto; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.6); z-index: 1200; justify-content: center; align-items: center; backdrop-filter: blur(4px); }
        .modal { background: var(--surface); padding: 30px; border-radius: var(--radius-lg); width: 100%; max-width: 480px; box-shadow: var(--shadow-lg); animation: slideUp 0.2s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        .modal-header h3 { margin: 0; font-size: 1.25rem; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; }
        .form-input { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: var(--radius-md); font-family: inherit; font-size: 0.9rem; color: var(--text-main); box-sizing: border-box; }
        .form-input:focus { outline: none; border-color: var(--accent); }
        .daily-itinerary { max-height: 300px; overflow-y: auto; margin-bottom: 20px; }
        .itinerary-item { background: var(--bg); padding: 12px; border-radius: var(--radius-md); margin-bottom: 10px; border: 1px solid var(--border); cursor: pointer; transition: all 0.2s; }
        .itinerary-item:hover { border-color: var(--accent); }
        .itinerary-title { font-weight: 700; font-size: 0.9rem; margin-bottom: 4px; }
        .itinerary-meta { font-size: 0.75rem; color: var(--text-muted); display: flex; justify-content: space-between; }
        .slide-panel-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.2); z-index: 1050; opacity: 0; visibility: hidden; transition: all 0.3s ease; backdrop-filter: blur(2px); }
        .slide-panel-overlay.active { opacity: 1; visibility: visible; }
        .slide-panel { position: fixed; top: 0; right: -480px; bottom: 0; width: 100%; max-width: 480px; background: var(--surface); box-shadow: -5px 0 25px rgba(0,0,0,0.1); z-index: 1100; transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; }
        .slide-panel.active { right: 0; }
        .panel-header { padding: 25px 25px 15px 25px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: flex-start; }
        .panel-header h2 { margin: 0; font-size: 1.4rem; color: var(--text-main); line-height: 1.2; }
        .status-badge { display: inline-block; font-size: 0.7rem; font-weight: 700; padding: 4px 10px; border-radius: 99px; margin-top: 10px; }
        .badge-SCHEDULED { background: #fef3c7; color: #b45309; }
        .badge-ATTENDED { background: #d1fae5; color: #047857; }
        .badge-CANCELED { background: #f1f5f9; color: #475569; text-decoration: line-through; }
        .panel-body { padding: 25px; overflow-y: auto; flex: 1; }
        .detail-block { margin-bottom: 25px; }
        .detail-label { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.5px; }
        .detail-content { font-size: 0.95rem; color: var(--text-main); line-height: 1.5; }
        .detail-card { background: var(--bg); border: 1px solid var(--border); padding: 15px; border-radius: var(--radius-md); }
        .panel-footer { padding: 20px 25px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 12px; background: var(--bg); }
        .action-row { display: flex; gap: 10px; width: 100%; }
        .action-row .btn { flex: 1; }
        .inline-new-contact { display: none; background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px dashed #cbd5e1; margin-top: 10px; animation: slideDown 0.2s ease-out; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
        .toast { position: fixed; bottom: 30px; right: 30px; background: var(--surface); border-left: 4px solid var(--success); padding: 15px 25px; border-radius: var(--radius-md); box-shadow: 0 10px 25px rgba(0,0,0,0.1); z-index: 9999; display: flex; align-items: center; gap: 10px; transform: translateY(100px); opacity: 0; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast-icon { background: #d1fae5; color: var(--success); width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.8rem; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-nav">
            <div style="display: flex; align-items: center; gap: 20px;">
                <h1 style="margin:0; font-size: 1.75rem; letter-spacing: -1px;">Schedule Hub</h1>
                <button class="btn btn-primary" onclick="openAddModal()">+ New Event</button>
            </div>
            
            <div class="controls-group">
                <div class="search-controls" id="yearly-search-container">
                    <span>🔍</span>
                    <input type="text" id="yearly-search" placeholder="Search title or company..." onkeyup="renderYearlyView()">
                </div>
                <div class="calendar-controls" id="controls-yearly">
                    <button class="btn-icon" onclick="changeYear(-1)">&#8592;</button>
                    <div class="view-title" id="year-display">2026</div>
                    <button class="btn-icon" onclick="changeYear(1)">&#8594;</button>
                </div>
                <div class="calendar-controls" id="controls-monthly" style="display: none;">
                    <button class="btn btn-outline" onclick="goToYearlyView()">&#8592; Back to Year</button>
                    <div style="width: 1px; height: 24px; background: var(--border); margin: 0 5px;"></div>
                    <button class="btn-icon" onclick="changeMonth(-1)">&#8592;</button>
                    <div class="view-title" id="month-display">May 2026</div>
                    <button class="btn-icon" onclick="changeMonth(1)">&#8594;</button>
                </div>
            </div>
        </div>

        <div class="calendar-wrapper" id="yearly-view"><div class="yearly-grid" id="yearly-grid"></div></div>
        <div class="calendar-wrapper" id="monthly-view">
            <div class="grid-header"><div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div></div>
            <div class="calendar-grid" id="calendar-grid"></div>
        </div>
    </div>

    <div id="toast" class="toast">
        <div class="toast-icon">✓</div>
        <div id="toast-msg" style="font-weight: 600; font-size: 0.9rem;">Success</div>
    </div>

    <div id="confirmModal" class="modal-overlay" style="z-index: 1300;">
        <div class="modal" style="max-width: 400px; text-align: center; border-top: 4px solid var(--danger);">
            <h3 id="confirm-title" style="margin-bottom: 10px;">Are you sure?</h3>
            <p id="confirm-msg" style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 25px;"></p>
            <div style="display: flex; gap: 10px;">
                <button class="btn btn-outline" style="flex: 1;" onclick="closeModal(event, 'confirmModal')">Cancel</button>
                <button class="btn btn-danger" style="flex: 1;" onclick="executeConfirm()">Yes, Delete</button>
            </div>
        </div>
    </div>

    <div id="alertModal" class="modal-overlay" style="z-index: 1300;">
        <div class="modal" style="max-width: 400px; text-align: center; border-top: 4px solid var(--accent);">
            <h3 id="alert-title" style="margin-bottom: 10px;">Notice</h3>
            <p id="alert-msg" style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 25px;"></p>
            <button class="btn btn-primary" style="width: 100%;" onclick="closeModal(event, 'alertModal')">Got it</button>
        </div>
    </div>

    <div id="dayModal" class="modal-overlay" onclick="closeModal(event, 'dayModal')">
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 id="day-modal-title"></h3>
                <button class="btn-icon" onclick="document.getElementById('dayModal').style.display='none'" style="border:none;">✖</button>
            </div>
            <div class="daily-itinerary" id="daily-itinerary-list"></div>
            <input type="hidden" id="day-modal-date-val">
            <button class="btn btn-primary" style="width: 100%;" onclick="passDateToAddModal()">+ Add Event on this Day</button>
        </div>
    </div>

    <div id="addModal" class="modal-overlay" onclick="closeModal(event, 'addModal')">
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3>Add New Event</h3>
                <button class="btn-icon" onclick="document.getElementById('addModal').style.display='none'" style="border:none;">✖</button>
            </div>
            <div class="form-group">
                <label>Event Title *</label>
                <input type="text" id="add-title" class="form-input" placeholder="e.g. 3-Day Summit or Document Pickup">
            </div>
            <div class="form-group">
                <label>Client / Contact (Optional)</label>
                <select id="add-contact" class="form-input" onchange="toggleNewContactFields('add')"></select>
                <div id="add-new-contact-fields" class="inline-new-contact">
                    <label style="color: var(--accent); display:block; margin-bottom:8px;">Create New Entity</label>
                    <input type="text" id="add-new-name" class="form-input" placeholder="Name or Company *" style="margin-bottom: 8px;">
                    <input type="text" id="add-new-sub" class="form-input" placeholder="Role or Department (Optional)">
                </div>
            </div>
            <div style="display: flex; gap: 10px;">
                <div class="form-group" style="flex: 1;">
                    <label>Start Date *</label>
                    <input type="date" id="add-start-date" class="form-input">
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>End Date</label>
                    <input type="date" id="add-end-date" class="form-input">
                </div>
            </div>
            <div style="display: flex; gap: 10px;">
                <div class="form-group" style="flex: 1;">
                    <label>Time</label>
                    <input type="text" id="add-time" class="form-input" placeholder="e.g. 10:00 AM">
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>Location / Platform</label>
                    <input type="text" id="add-location" class="form-input" placeholder="e.g. Office">
                </div>
            </div>
            <div class="form-group">
                <label>Agenda / Description</label>
                <textarea id="add-desc" class="form-input" rows="3" placeholder="Notes for the event..."></textarea>
            </div>
            <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:10px;">
                <button class="btn btn-outline" onclick="document.getElementById('addModal').style.display='none'">Cancel</button>
                <button class="btn btn-primary" onclick="saveNewMeeting()">Save Event</button>
            </div>
        </div>
    </div>

    <div id="editModal" class="modal-overlay" onclick="closeModal(event, 'editModal')">
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3>Edit Event</h3>
                <button class="btn-icon" onclick="document.getElementById('editModal').style.display='none'" style="border:none;">✖</button>
            </div>
            <div class="form-group">
                <label>Event Title</label>
                <input type="text" id="edit-title" class="form-input">
            </div>
            <div class="form-group">
                <label>Client / Contact (Optional)</label>
                <select id="edit-contact" class="form-input"></select>
            </div>
            <div style="display: flex; gap: 10px;">
                <div class="form-group" style="flex: 1;">
                    <label>Start Date</label>
                    <input type="date" id="edit-start-date" class="form-input">
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>End Date</label>
                    <input type="date" id="edit-end-date" class="form-input">
                </div>
            </div>
            <div style="display: flex; gap: 10px;">
                <div class="form-group" style="flex: 1;">
                    <label>Time</label>
                    <input type="text" id="edit-time" class="form-input">
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>Status</label>
                    <select id="edit-status" class="form-input">
                        <option value="SCHEDULED">Scheduled</option>
                        <option value="ATTENDED">Attended</option>
                        <option value="CANCELED">Canceled</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>Location / Platform</label>
                <input type="text" id="edit-location" class="form-input">
            </div>
            <div class="form-group">
                <label>Agenda / Description</label>
                <textarea id="edit-desc" class="form-input" rows="3"></textarea>
            </div>
            <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:10px;">
                <button class="btn btn-outline" onclick="document.getElementById('editModal').style.display='none'">Cancel</button>
                <button class="btn btn-primary" onclick="saveMeetingChanges()">Save Changes</button>
            </div>
        </div>
    </div>

    <div class="slide-panel-overlay" id="panel-overlay" onclick="closeMeetingDetails()"></div>
    <div class="slide-panel" id="meeting-panel">
        <div class="panel-header">
            <div>
                <h2 id="det-title">Meeting Title</h2>
                <div id="det-status" class="status-badge badge-SCHEDULED">SCHEDULED</div>
            </div>
            <button class="btn-icon" onclick="closeMeetingDetails()" style="border:none;">✖</button>
        </div>
        <div class="panel-body">
            <div class="detail-block">
                <div class="detail-label">Date & Time</div>
                <div class="detail-content" id="det-datetime" style="font-weight: 600;"></div>
            </div>
            <div class="detail-block detail-card" id="det-contact-block">
                <div class="detail-label">Client / Entity</div>
                <div class="detail-content" style="font-weight: 700; font-size: 1.1rem;" id="det-contact-name"></div>
                <div class="detail-content" style="color: var(--text-muted); font-size: 0.85rem;" id="det-contact-sub"></div>
            </div>
            <div class="detail-block">
                <div class="detail-label">Location / Platform</div>
                <div class="detail-content" id="det-location"></div>
            </div>
            <div class="detail-block">
                <div class="detail-label">Agenda / Description</div>
                <div class="detail-content" id="det-desc" style="white-space: pre-line;"></div>
            </div>
        </div>
        <div class="panel-footer">
            <div class="action-row">
                <button class="btn btn-accent" onclick="exportToGoogleCalendar()">📅 Add to Calendar</button>
                <button class="btn btn-success" onclick="sendEmailInvite()">✉️ Email Invite</button>
            </div>
            <div style="height: 1px; background: var(--border); margin: 5px 0;"></div>
            <div class="action-row">
                <button class="btn btn-danger-outline" style="flex: 0.5;" onclick="triggerDelete()">Delete</button>
                <button class="btn btn-outline" style="flex: 0.5;" onclick="closeMeetingDetails()">Close</button>
                <button class="btn btn-primary" style="flex: 1;" onclick="openEditModal()">Edit Details</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://lcqxorfwgzgdzblhjawp.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_X2fNP8wA2qyU1EPTzqKx1w_WeSXNa9B';
        let supabase = null;
        let isSupabaseConnected = false;

        function initSupabaseClient() {
            if (typeof window !== "undefined" && window.supabase && typeof window.supabase.createClient === 'function') {
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            } else {
                console.warn("Supabase library not found. Running purely offline.");
            }
        }

        async function verifySupabaseConnection() {
            if (!supabase) return;

            try {
                const { data, error } = await supabase.from('meetings').select('id').limit(1);
                if (error) throw error;
                isSupabaseConnected = true;
                showToast('Connected to Supabase');
            } catch (err) {
                console.warn('Unable to reach Supabase:', err);
                isSupabaseConnected = false;
                showAlert('Supabase Unavailable', 'Could not connect to the Supabase database. The app will continue in offline mode.');
            }
        }

        let currentDate = new Date(); 
        let displayYear = currentDate.getFullYear();
        let displayMonth = currentDate.getMonth();
        let currentOpenMeetingId = null; 

        const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

        let contacts = [
            { id: 101, name: 'John Doe', sub: 'Project Alpha' },
            { id: 102, name: 'TechCorp Inc.', sub: 'Supplier' },
            { id: 103, name: 'Sarah Smith', sub: 'Marketing' }
        ];

        let meetings = [];

        function getTodayStr() { return `${currentDate.getFullYear()}-${String(currentDate.getMonth()+1).padStart(2,'0')}-${String(currentDate.getDate()).padStart(2,'0')}`; }

        function showToast(msg) {
            let toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function showAlert(title, msg) {
            document.getElementById('alert-title').innerText = title;
            document.getElementById('alert-msg').innerText = msg;
            document.getElementById('alertModal').style.display = 'flex';
        }

        let confirmCallback = null;
        function showConfirm(title, msg, callback) {
            document.getElementById('confirm-title').innerText = title;
            document.getElementById('confirm-msg').innerText = msg;
            confirmCallback = callback;
            document.getElementById('confirmModal').style.display = 'flex';
        }
        function executeConfirm() {
            if(confirmCallback) confirmCallback();
            closeModal(null, 'confirmModal');
        }

        function populateContactDropdowns() {
            let options = '<option value="">-- None / General Event --</option>';
            contacts.forEach(c => { options += `<option value="${c.id}">${c.name} (${c.sub})</option>`; });
            let addSelect = document.getElementById('add-contact');
            if(addSelect) addSelect.innerHTML = options + '<option value="NEW">+ Add New Contact...</option>';
            let editSelect = document.getElementById('edit-contact');
            if(editSelect) editSelect.innerHTML = options;
        }

        function toggleNewContactFields(prefix) {
            let select = document.getElementById(`${prefix}-contact`);
            let newFields = document.getElementById(`${prefix}-new-contact-fields`);
            if(select.value === 'NEW') newFields.style.display = 'block';
            else newFields.style.display = 'none';
        }

        async function fetchMeetings() {
            if (!supabase) {
                meetings = [{ id: 1, title: "Offline Consultation", ownerId: 101, startDate: getTodayStr(), endDate: getTodayStr(), time: "10:00 AM", status: "SCHEDULED", location: "Local", description: "You are currently disconnected from the cloud database." }];
                showAlert("Running Offline", "Could not connect to the cloud database. Showing temporary offline data.");
                refreshViews();
                return;
            }
            try {
                const { data, error } = await supabase.from('meetings').select('*');
                if (error) throw error;
                if (data) {
                    meetings = data.map(m => ({ id: m.id, title: m.title, ownerId: m.owner_id, startDate: m.start_date, endDate: m.end_date, time: m.time || 'TBD', status: m.status, location: m.location, description: m.description }));
                }
                refreshViews();
            } catch (err) {
                console.error("Fetch Error:", err);
                showAlert("Database Error", "Failed to retrieve events from the cloud.");
                refreshViews();
            }
        }

        function openAddModal(defaultDate = null) {
            document.getElementById('dayModal').style.display = 'none'; 
            document.getElementById('add-title').value = '';
            document.getElementById('add-contact').value = '';
            document.getElementById('add-new-contact-fields').style.display = 'none';
            document.getElementById('add-new-name').value = '';
            document.getElementById('add-new-sub').value = '';
            document.getElementById('add-time').value = '10:00 AM';
            document.getElementById('add-location').value = '';
            document.getElementById('add-desc').value = '';
            let dateToSet = defaultDate || getTodayStr();
            document.getElementById('add-start-date').value = dateToSet;
            document.getElementById('add-end-date').value = dateToSet;
            document.getElementById('addModal').style.display = 'flex';
        }

        function passDateToAddModal() {
            let dateVal = document.getElementById('day-modal-date-val').value;
            openAddModal(dateVal);
        }

        async function saveNewMeeting() {
            let title = document.getElementById('add-title').value.trim();
            let contactSelectVal = document.getElementById('add-contact').value;
            let start = document.getElementById('add-start-date').value;
            let end = document.getElementById('add-end-date').value || start;
            let finalContactId = null;
            if(!title || !start) return showAlert("Missing Info", "Please fill out the Event Title and Start Date.");
            if(end < start) return showAlert("Invalid Date", "End Date cannot be before the Start Date.");
            if (contactSelectVal === 'NEW') {
                let newName = document.getElementById('add-new-name').value.trim();
                let newSub = document.getElementById('add-new-sub').value.trim();
                if(!newName) return showAlert("Missing Info", "Please enter the new contact's name.");
                finalContactId = Date.now();
                contacts.push({ id: finalContactId, name: newName, sub: newSub });
                populateContactDropdowns();
            } else if (contactSelectVal !== "") {
                finalContactId = parseInt(contactSelectVal);
            }
            let newMeetingData = { title: title, owner_id: finalContactId, start_date: start, end_date: end, time: document.getElementById('add-time').value.trim() || 'TBD', status: 'SCHEDULED', location: document.getElementById('add-location').value.trim(), description: document.getElementById('add-desc').value.trim() };
            if (!supabase) {
                meetings.push({ id: Date.now(), title: newMeetingData.title, ownerId: newMeetingData.owner_id, startDate: newMeetingData.start_date, endDate: newMeetingData.end_date, time: newMeetingData.time, status: newMeetingData.status, location: newMeetingData.location, description: newMeetingData.description });
                document.getElementById('addModal').style.display = 'none';
                refreshViews();
                showToast("Event saved locally (Offline)");
                return;
            }
            try {
                const { error } = await supabase.from('meetings').insert([newMeetingData]);
                if (error) throw error;
                showToast("Event saved to cloud");
                document.getElementById('addModal').style.display = 'none';
                fetchMeetings();
            } catch (err) {
                console.error("Save Error:", err);
                showAlert("Database Error", "Failed to save to Supabase.");
            }
        }

        function openEditModal() {
            if(!currentOpenMeetingId) return;
            let m = meetings.find(x => x.id === currentOpenMeetingId);
            document.getElementById('edit-title').value = m.title;
            document.getElementById('edit-contact').value = m.ownerId || "";
            document.getElementById('edit-start-date').value = m.startDate;
            document.getElementById('edit-end-date').value = m.endDate;
            document.getElementById('edit-time').value = m.time;
            document.getElementById('edit-status').value = m.status;
            document.getElementById('edit-location').value = m.location || '';
            document.getElementById('edit-desc').value = m.description || '';
            closeMeetingDetails();
            document.getElementById('editModal').style.display = 'flex';
        }

        async function saveMeetingChanges() {
            if(!currentOpenMeetingId) return;
            let start = document.getElementById('edit-start-date').value;
            let end = document.getElementById('edit-end-date').value || start;
            if(end < start) return showAlert("Invalid Date", "End Date cannot be before the Start Date.");
            let contactVal = document.getElementById('edit-contact').value;
            let finalContactId = contactVal !== "" ? parseInt(contactVal) : null;
            if (!supabase) {
                let m = meetings.find(x => x.id === currentOpenMeetingId);
                m.title = document.getElementById('edit-title').value.trim();
                m.ownerId = finalContactId;
                m.startDate = start;
                m.endDate = end;
                m.time = document.getElementById('edit-time').value.trim();
                m.status = document.getElementById('edit-status').value;
                m.location = document.getElementById('edit-location').value.trim();
                m.description = document.getElementById('edit-desc').value.trim();
                document.getElementById('editModal').style.display = 'none';
                refreshViews();
                showToast("Changes saved locally (Offline)");
                return;
            }
            try {
                const { error } = await supabase.from('meetings').update({ title: document.getElementById('edit-title').value.trim(), owner_id: finalContactId, start_date: start, end_date: end, time: document.getElementById('edit-time').value.trim(), status: document.getElementById('edit-status').value, location: document.getElementById('edit-location').value.trim(), description: document.getElementById('edit-desc').value.trim() }).eq('id', currentOpenMeetingId);
                if (error) throw error;
                showToast("Changes synced to cloud");
                document.getElementById('editModal').style.display = 'none';
                closeMeetingDetails();
                fetchMeetings();
            } catch (err) {
                console.error("Edit Error:", err);
                showAlert("Database Error", "Failed to update Supabase.");
            }
        }

        function triggerDelete() {
            if(!currentOpenMeetingId) return;
            showConfirm("Delete Event?", "Are you sure you want to permanently delete this event?", async function() {
                if (!supabase) {
                    meetings = meetings.filter(m => m.id !== currentOpenMeetingId);
                    closeMeetingDetails();
                    refreshViews();
                    showToast("Event deleted locally");
                    return;
                }
                try {
                    const { error } = await supabase.from('meetings').delete().eq('id', currentOpenMeetingId);
                    if (error) throw error;
                    showToast("Event deleted from cloud");
                    closeMeetingDetails();
                    fetchMeetings();
                } catch (err) {
                    console.error("Delete Error:", err);
                    showAlert("Database Error", "Failed to delete from Supabase.");
                }
            });
        }

        function refreshViews() {
            if(document.getElementById('yearly-view').style.display === 'block') renderYearlyView();
            else renderCalendar();
        }

        function parseTimeStr(timeStr) {
            let [time, modifier] = timeStr.split(' ');
            let [hours, minutes] = (time || "0:0").split(':');
            hours = parseInt(hours) || 0;
            if (hours === 12 && modifier === 'AM') hours = 0;
            else if (modifier === 'PM' && hours !== 12) hours += 12;
            return { h: String(hours).padStart(2, '0'), m: minutes || '00' };
        }

        function exportToGoogleCalendar() {
            if(!currentOpenMeetingId) return;
            let m = meetings.find(x => x.id === currentOpenMeetingId);
            let contactName = m.ownerId ? (contacts.find(c => c.id === m.ownerId)?.name || '') : '';
            let titleText = contactName ? `${m.title} with ${contactName}` : m.title;
            let dateStrStart = m.startDate.replace(/-/g, '');
            let dateStrEnd = m.endDate.replace(/-/g, '');
            let parsedTime = parseTimeStr(m.time);
            let startT = `${dateStrStart}T${parsedTime.h}${parsedTime.m}00`;
            let endHour = String(parseInt(parsedTime.h) + 1).padStart(2, '0');
            let endT = `${dateStrEnd}T${endHour}${parsedTime.m}00`;
            let url = new URL('https://calendar.google.com/calendar/render');
            url.searchParams.append('action', 'TEMPLATE');
            url.searchParams.append('text', titleText);
            url.searchParams.append('dates', `${startT}/${endT}`);
            url.searchParams.append('details', m.description || '');
            url.searchParams.append('location', m.location || '');
            window.open(url.toString(), '_blank');
        }

        function sendEmailInvite() {
            if(!currentOpenMeetingId) return;
            let m = meetings.find(x => x.id === currentOpenMeetingId);
            let contactName = m.ownerId ? (contacts.find(c => c.id === m.ownerId)?.name || 'there') : 'there';
            let dateDisplay = m.startDate === m.endDate ? new Date(m.startDate + "T00:00:00").toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }) : `${new Date(m.startDate + "T00:00:00").toLocaleDateString('en-US', { month: 'short', day: 'numeric'})} - ${new Date(m.endDate + "T00:00:00").toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}`;
            let subject = encodeURIComponent(`Event Invite: ${m.title}`);
            let body = encodeURIComponent(`Hi ${contactName},\n\nI would like to invite you to the following event:\n\n📌 Topic: ${m.title}\n📅 Date: ${dateDisplay}\n⏰ Time: ${m.time}\n📍 Location: ${m.location || 'TBD'}\n\nAgenda:\n${m.description || 'No specific agenda provided.'}\n\nLooking forward to it!\n\nBest regards,`);
            window.location.href = `mailto:?subject=${subject}&body=${body}`;
        }

        function openMeetingDetails(event, meetingId) {
            if(event) event.stopPropagation();
            currentOpenMeetingId = meetingId;
            let m = meetings.find(x => x.id === meetingId);
            let dateDisplay = m.startDate === m.endDate ? new Date(m.startDate + "T00:00:00").toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }) : `${new Date(m.startDate + "T00:00:00").toLocaleDateString('en-US', { month: 'short', day: 'numeric'})} to ${new Date(m.endDate + "T00:00:00").toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}`;
            document.getElementById('det-title').innerText = m.title;
            let statusBadge = document.getElementById('det-status');
            statusBadge.innerText = m.status;
            statusBadge.className = `status-badge badge-${m.status}`;
            document.getElementById('det-datetime').innerText = `${dateDisplay} • ${m.time}`;
            if(!m.ownerId) {
                document.getElementById('det-contact-name').innerText = "General Event / Errand";
                document.getElementById('det-contact-sub').innerText = "No specific entity attached";
            } else {
                let contact = contacts.find(c => c.id === m.ownerId);
                document.getElementById('det-contact-name').innerText = contact.name;
                document.getElementById('det-contact-sub').innerText = contact.sub;
            }
            document.getElementById('det-location').innerText = m.location || "TBD";
            document.getElementById('det-desc').innerText = m.description || "No description provided.";
            document.getElementById('panel-overlay').classList.add('active');
            document.getElementById('meeting-panel').classList.add('active');
        }

        function closeMeetingDetails() {
            document.getElementById('panel-overlay').classList.remove('active');
            document.getElementById('meeting-panel').classList.remove('active');
        }

        function changeYear(dir) { displayYear += dir; renderYearlyView(); }

        function renderYearlyView() {
            document.getElementById('year-display').innerText = displayYear;
            const searchTerm = document.getElementById('yearly-search').value.toLowerCase();
            const grid = document.getElementById('yearly-grid');
            let html = '';
            for (let i = 0; i < 12; i++) {
                let monthStr = String(i + 1).padStart(2, '0');
                let monthStart = `${displayYear}-${monthStr}-01`;
                let monthEnd = `${displayYear}-${monthStr}-31`;
                let monthMeetings = meetings.filter(m => m.startDate <= monthEnd && m.endDate >= monthStart);
                monthMeetings.sort((a, b) => a.startDate.localeCompare(b.startDate) || a.time.localeCompare(b.time));
                let miniPillsHtml = '';
                monthMeetings.forEach(m => {
                    let contactName = m.ownerId ? (contacts.find(c => c.id === m.ownerId)?.name || '') : 'General';
                    let searchableText = `${m.title} ${contactName}`.toLowerCase();
                    let isMatch = searchTerm && searchableText.includes(searchTerm);
                    let highlightClass = isMatch ? 'highlight-match' : '';
                    let dayDisplay = m.startDate === m.endDate ? parseInt(m.startDate.split('-')[2]) : `${parseInt(m.startDate.split('-')[2])}-${parseInt(m.endDate.split('-')[2])}`;
                    miniPillsHtml += `
                        <div class="mini-meeting-pill ${highlightClass}" title="${m.title}" onclick="openMeetingDetails(event, ${m.id})">
                            <span style="opacity: 0.5; margin-right: 4px;">${dayDisplay}</span> ${m.title}
                        </div>`;
                });
                let emptyState = monthMeetings.length === 0 ? `<div style="font-size:0.75rem; color:var(--text-muted); font-style:italic; padding-top: 5px;">No events</div>` : '';
                let countBadge = monthMeetings.length > 0 ? `<span class="month-card-count">${monthMeetings.length}</span>` : '';
                let isCurrentMonth = (i === currentDate.getMonth() && displayYear === currentDate.getFullYear());
                let borderStyle = isCurrentMonth ? 'border: 2px solid var(--accent);' : '';
                html += `
                    <div class="month-card" style="${borderStyle}" onclick="goToMonthlyView(${i})">
                        <div class="month-card-header"><span class="month-card-title">${monthNames[i]}</span>${countBadge}</div>
                        <div class="month-card-body">${miniPillsHtml}${emptyState}</div>
                    </div>`;
            }
            grid.innerHTML = html;
        }

        function goToYearlyView() {
            document.getElementById('monthly-view').style.display = 'none';
            document.getElementById('controls-monthly').style.display = 'none';
            document.getElementById('yearly-view').style.display = 'block';
            document.getElementById('controls-yearly').style.display = 'flex';
            document.getElementById('yearly-search-container').style.display = 'flex';
            renderYearlyView();
        }

        function goToMonthlyView(monthIndex) {
            displayMonth = monthIndex;
            document.getElementById('yearly-view').style.display = 'none';
            document.getElementById('controls-yearly').style.display = 'none';
            document.getElementById('yearly-search-container').style.display = 'none';
            document.getElementById('monthly-view').style.display = 'block';
            document.getElementById('controls-monthly').style.display = 'flex';
            renderCalendar();
        }

        function changeMonth(dir) {
            displayMonth += dir;
            if (displayMonth > 11) { displayMonth = 0; displayYear++; }
            else if (displayMonth < 0) { displayMonth = 11; displayYear--; }
            renderCalendar();
        }

        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            document.getElementById('month-display').innerText = new Date(displayYear, displayMonth, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
            grid.innerHTML = '';
            let firstDay = new Date(displayYear, displayMonth, 1);
            let lastDay = new Date(displayYear, displayMonth + 1, 0);
            let startingDayOfWeek = firstDay.getDay();
            let totalDays = lastDay.getDate();
            let prevMonthLastDay = new Date(displayYear, displayMonth, 0).getDate();
            let html = '';
            for(let i = startingDayOfWeek - 1; i >= 0; i--) { html += `<div class="day-cell other-month"><div class="day-number">${prevMonthLastDay - i}</div></div>`; }
            for(let day = 1; day <= totalDays; day++) {
                let dateStr = `${displayYear}-${String(displayMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
                let isToday = dateStr === getTodayStr() ? 'today' : '';
                let dayMeetings = meetings.filter(m => dateStr >= m.startDate && dateStr <= m.endDate);
                dayMeetings.sort((a,b) => a.time.localeCompare(b.time));
                let pillsHtml = '';
                let displayCount = Math.min(dayMeetings.length, 3);
                for(let i=0; i<displayCount; i++) {
                    let m = dayMeetings[i];
                    pillsHtml += `<div class="meeting-pill status-${m.status}" title="${m.title}" onclick="openMeetingDetails(event, ${m.id})">${m.time} - ${m.title}</div>`;
                }
                let moreBadge = dayMeetings.length > 3 ? `<div class="more-badge">+${dayMeetings.length - 3} more</div>` : '';
                html += `
                    <div class="day-cell ${isToday}" onclick="openDayDetails('${dateStr}')">
                        <div class="day-number">${day}</div>
                        ${pillsHtml}
                        ${moreBadge}
                    </div>`;
            }
            let totalCellsUsed = startingDayOfWeek + totalDays;
            let cellsRemaining = (Math.ceil(totalCellsUsed / 7) * 7) - totalCellsUsed;
            for(let i = 1; i <= cellsRemaining; i++) { html += `<div class="day-cell other-month"><div class="day-number">${i}</div></div>`; }
            grid.innerHTML = html;
        }

        function openDayDetails(dateStr) {
            let d = new Date(dateStr + "T00:00:00");
            document.getElementById('day-modal-title').innerText = d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
            document.getElementById('day-modal-date-val').value = dateStr;
            let listContainer = document.getElementById('daily-itinerary-list');
            let dayMeetings = meetings.filter(m => dateStr >= m.startDate && dateStr <= m.endDate);
            if(dayMeetings.length === 0) {
                listContainer.innerHTML = `<div style="text-align:center; color:var(--text-muted); padding: 20px 0;">No events scheduled.</div>`;
            } else {
                let html = '';
                dayMeetings.forEach(m => {
                    let contactName = m.ownerId ? (contacts.find(c => c.id === m.ownerId)?.name || '') : 'General Event';
                    html += `
                        <div class="itinerary-item" onclick="openMeetingDetails(event, ${m.id})">
                            <div class="itinerary-title">${m.title}</div>
                            <div class="itinerary-meta">
                                <span>🕒 ${m.time}</span>
                                <span style="font-weight:600; color:var(--primary);">${contactName}</span>
                            </div>
                        </div>`;
                });
                listContainer.innerHTML = html;
            }
            document.getElementById('dayModal').style.display = 'flex';
        }

        function closeModal(e, modalId) {
            if(e && e.target && e.target.id === modalId) { document.getElementById(modalId).style.display = 'none'; }
            else if (!e) { document.getElementById(modalId).style.display = 'none'; }
        }

        window.onload = async function() {
            initSupabaseClient();
            populateContactDropdowns();
            renderYearlyView();
            await verifySupabaseConnection();
            fetchMeetings();
        };
    </script>
</body>
</html>
